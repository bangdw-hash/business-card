<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 신청 이력 | 아세아항공직업전문학교</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- Navigation -->
<nav class="nav-bar">
  <a href="index.html" class="nav-logo">
    <span class="nav-logo-badge">ASEA</span>
    <span class="nav-logo-text">
      아세아항공직업전문학교
      <span class="nav-logo-sub">명함 신청 시스템</span>
    </span>
  </a>
  <div class="nav-links">
    <a href="index.html" class="nav-link">신청서 작성</a>
    <a href="my-requests.html" class="nav-link active">내 신청 이력</a>
  </div>
</nav>

<!-- Detail Modal -->
<div id="detail-modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h3 id="detail-modal-title">명함 신청 상세</h3>
      <button id="detail-modal-close" class="modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <!-- Status Badge -->
      <div style="margin-bottom:16px;">
        <span id="detail-status-badge"></span>
        <span id="detail-urgent-badge"></span>
      </div>

      <!-- Revision alert -->
      <div id="detail-revision-alert" class="alert alert-warning hidden">
        🔄 <strong>수정 요청됨:</strong> <span id="detail-admin-note-display"></span>
        <div style="margin-top:8px;">
          <button id="btn-open-edit" class="btn btn-warning btn-sm">편집하기 →</button>
        </div>
      </div>

      <!-- Rejected alert -->
      <div id="detail-rejected-alert" class="alert alert-error hidden">
        ❌ <strong>반려 사유:</strong> <span id="detail-reject-reason"></span>
      </div>

      <!-- Card previews -->
      <div class="card-previews-row" style="margin-bottom:20px;">
        <div class="card-preview-container">
          <div class="card-preview-label">앞면</div>
          <div class="card-canvas-wrapper">
            <canvas id="detail-front-canvas" width="1050" height="600"></canvas>
          </div>
        </div>
        <div id="detail-back-preview" class="card-preview-container hidden">
          <div class="card-preview-label">뒷면 (영문)</div>
          <div class="card-canvas-wrapper">
            <canvas id="detail-back-canvas" width="1050" height="600"></canvas>
          </div>
        </div>
      </div>

      <!-- Detail info -->
      <div class="detail-grid">
        <div class="detail-item"><div class="detail-label">이름</div><div class="detail-value" id="d-name">-</div></div>
        <div class="detail-item"><div class="detail-label">이름 (English)</div><div class="detail-value" id="d-name-en">-</div></div>
        <div class="detail-item"><div class="detail-label">부서</div><div class="detail-value" id="d-dept">-</div></div>
        <div class="detail-item"><div class="detail-label">부서 (English)</div><div class="detail-value" id="d-dept-en">-</div></div>
        <div class="detail-item"><div class="detail-label">직급</div><div class="detail-value" id="d-position">-</div></div>
        <div class="detail-item"><div class="detail-label">직급 (English)</div><div class="detail-value" id="d-position-en">-</div></div>
        <div class="detail-item"><div class="detail-label">전화번호</div><div class="detail-value" id="d-phone">-</div></div>
        <div class="detail-item"><div class="detail-label">휴대폰</div><div class="detail-value" id="d-mobile">-</div></div>
        <div class="detail-item"><div class="detail-label">이메일</div><div class="detail-value" id="d-email">-</div></div>
        <div class="detail-item"><div class="detail-label">내선번호</div><div class="detail-value" id="d-ext">-</div></div>
        <div class="detail-item"><div class="detail-label">용지 종류</div><div class="detail-value" id="d-paper">-</div></div>
        <div class="detail-item"><div class="detail-label">수량</div><div class="detail-value" id="d-qty">-</div></div>
        <div class="detail-item"><div class="detail-label">신청일</div><div class="detail-value" id="d-created">-</div></div>
        <div class="detail-item"><div class="detail-label">납기일</div><div class="detail-value" id="d-deadline">-</div></div>
      </div>

      <!-- Timeline -->
      <div style="margin-top:16px;">
        <div class="summary-title">🔄 신청 히스토리</div>
        <div id="detail-timeline"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button id="detail-modal-close-btn" class="btn btn-secondary">닫기</button>
    </div>
  </div>
</div>

<!-- Edit Modal (for revision) -->
<div id="edit-modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header" style="background:var(--orange);">
      <h3>수정 요청 대응 &mdash; 내용 편집</h3>
      <button id="edit-modal-close" class="modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="alert alert-warning" style="margin-bottom:16px;">
        🔄 관리자 요청 사항: <strong id="edit-admin-note"></strong>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>이름 (국문) <span class="required">*</span></label>
          <input type="text" id="edit-name" class="form-input">
        </div>
        <div class="form-group">
          <label>이름 (영문)</label>
          <input type="text" id="edit-name-en" class="form-input">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>부서 <span class="required">*</span></label>
          <input type="text" id="edit-department" class="form-input">
        </div>
        <div class="form-group">
          <label>부서 (영문)</label>
          <input type="text" id="edit-department-en" class="form-input">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>직급 (국문) <span class="required">*</span></label>
          <input type="text" id="edit-position-kr" class="form-input">
        </div>
        <div class="form-group">
          <label>직급 (영문)</label>
          <input type="text" id="edit-position-en" class="form-input">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>전화번호</label>
          <input type="tel" id="edit-phone" class="form-input">
        </div>
        <div class="form-group">
          <label>휴대폰</label>
          <input type="tel" id="edit-mobile" class="form-input">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>이메일 <span class="required">*</span></label>
          <input type="email" id="edit-email" class="form-input">
        </div>
        <div class="form-group">
          <label>내선번호</label>
          <input type="text" id="edit-extension" class="form-input">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button id="edit-modal-close-btn" class="btn btn-secondary">취소</button>
      <button id="btn-submit-edit" class="btn btn-primary">수정 제출</button>
    </div>
  </div>
</div>

<!-- Main -->
<div class="container">
  <div class="section-title">내 명함 신청 이력</div>

  <!-- Lookup Form -->
  <div class="lookup-form">
    <p style="font-size:14px;color:var(--gray-600);margin-bottom:16px;">신청 시 입력한 이름과 이메일을 입력하면 신청 내역을 조회할 수 있습니다.</p>
    <div class="form-row">
      <div class="form-group">
        <label for="lookup-name">이름 <span class="required">*</span></label>
        <input type="text" id="lookup-name" class="form-input" placeholder="신청 시 입력한 이름">
      </div>
      <div class="form-group">
        <label for="lookup-email">이메일 <span class="required">*</span></label>
        <input type="email" id="lookup-email" class="form-input" placeholder="신청 시 입력한 이메일">
      </div>
    </div>
    <button id="btn-lookup" class="btn btn-primary">🔍 신청 이력 조회</button>
  </div>

  <!-- Results -->
  <div id="lookup-loading" class="loading-dots hidden">
    <span></span><span></span><span></span>
  </div>

  <div id="results-container"></div>

</div>

<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/preview.js"></script>
<script src="js/notifications.js"></script>

<script>
'use strict';
var myRequests = [];
var editingRequest = null;

document.addEventListener('DOMContentLoaded', function() {
  // Lookup button
  var lookupBtn = document.getElementById('btn-lookup');
  if (lookupBtn) lookupBtn.addEventListener('click', lookupRequests);

  // Enter key in inputs
  ['lookup-name', 'lookup-email'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('keydown', function(e) { if (e.key === 'Enter') lookupRequests(); });
  });

  // Close modals
  ['detail-modal-close', 'detail-modal-close-btn'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('click', closeDetailModal);
  });
  var detailOverlay = document.getElementById('detail-modal-overlay');
  if (detailOverlay) detailOverlay.addEventListener('click', function(e) {
    if (e.target === detailOverlay) closeDetailModal();
  });

  ['edit-modal-close', 'edit-modal-close-btn'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('click', closeEditModal);
  });
  var editOverlay = document.getElementById('edit-modal-overlay');
  if (editOverlay) editOverlay.addEventListener('click', function(e) {
    if (e.target === editOverlay) closeEditModal();
  });

  // Open edit from detail
  var openEditBtn = document.getElementById('btn-open-edit');
  if (openEditBtn) openEditBtn.addEventListener('click', function() {
    closeDetailModal();
    openEditModal(editingRequest);
  });

  // Submit edit
  var submitEditBtn = document.getElementById('btn-submit-edit');
  if (submitEditBtn) submitEditBtn.addEventListener('click', submitEdit);
});

async function lookupRequests() {
  var name  = document.getElementById('lookup-name').value.trim();
  var email = document.getElementById('lookup-email').value.trim();

  if (!name || !email) {
    alert('이름과 이메일을 모두 입력해주세요.');
    return;
  }

  var loadingEl = document.getElementById('lookup-loading');
  var container = document.getElementById('results-container');

  if (loadingEl) loadingEl.classList.remove('hidden');
  if (container) container.innerHTML = '';

  try {
    var { data, error } = await window.supabase
      .from('card_requests')
      .select('*')
      .eq('applicant_name', name)
      .eq('email', email)
      .order('created_at', { ascending: false });

    if (error) throw error;
    myRequests = data || [];
    renderResults();
  } catch(e) {
    console.error('[MyRequests] 조회 실패:', e);
    if (container) container.innerHTML = '<div class="alert alert-error">Supabase 연결에 실패했습니다. CONFIG.supabase를 확인해주세요.</div>';
  } finally {
    if (loadingEl) loadingEl.classList.add('hidden');
  }
}

function renderResults() {
  var container = document.getElementById('results-container');
  if (!container) return;

  if (myRequests.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-title">신청 내역이 없습니다</div><div class="empty-state-desc">입력하신 이름과 이메일로 신청된 명함이 없습니다.</div></div>';
    return;
  }

  container.innerHTML = '<div style="font-size:14px;font-weight:600;color:var(--gray-700);margin-bottom:12px;">신청 이력 (' + myRequests.length + '건)</div>' +
    myRequests.map(function(req) {
      var date = new Date(req.created_at).toLocaleDateString('ko-KR');
      var paperLabel = CONFIG.PAPER_TYPE_NAMES[req.paper_type] || req.paper_type;
      var urgentBadge = req.is_urgent ? '<span class="urgent-badge">⚠ 긴급</span>' : '';
      return '<div class="request-card" data-id="' + req.id + '">' +
        '<div class="request-card-info">' +
          '<div class="request-card-title">' + esc(req.applicant_name) + ' &mdash; ' + esc(req.department) + ' ' + esc(req.position_kr) + '</div>' +
          '<div class="request-card-meta">' +
            '<span>' + date + '</span>' +
            '<span>' + paperLabel + '</span>' +
            '<span>' + (req.quantity || '-') + '장</span>' +
          '</div>' +
        '</div>' +
        '<div class="request-card-badges">' +
          urgentBadge +
          '<span class="badge badge-' + req.status + '">' + (CONFIG.STATUS_NAMES[req.status] || req.status) + '</span>' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>' +
        '</div>' +
      '</div>';
    }).join('');

  // Bind click
  container.querySelectorAll('.request-card').forEach(function(card) {
    card.addEventListener('click', function() {
      var req = myRequests.find(function(r) { return r.id === card.dataset.id; });
      if (req) openDetailModal(req);
    });
  });
}

function openDetailModal(req) {
  editingRequest = req;
  var overlay = document.getElementById('detail-modal-overlay');
  if (!overlay) return;
  overlay.classList.remove('hidden');

  document.getElementById('detail-modal-title').textContent = req.applicant_name + ' 님 명함 신청';

  // Status badge
  var statusBadgeEl = document.getElementById('detail-status-badge');
  if (statusBadgeEl) {
    statusBadgeEl.className = 'badge badge-' + req.status;
    statusBadgeEl.textContent = CONFIG.STATUS_NAMES[req.status] || req.status;
  }

  var urgentBadgeEl = document.getElementById('detail-urgent-badge');
  if (urgentBadgeEl) {
    urgentBadgeEl.innerHTML = req.is_urgent ? '<span class="urgent-badge" style="margin-left:8px;">⚠ 긴급</span>' : '';
  }

  // Revision / Rejected alerts
  var revAlert = document.getElementById('detail-revision-alert');
  var rejAlert = document.getElementById('detail-rejected-alert');
  if (revAlert) revAlert.classList.toggle('hidden', req.status !== 'revision');
  if (rejAlert) rejAlert.classList.toggle('hidden', req.status !== 'rejected');
  if (req.status === 'revision' && req.admin_note) {
    var noteDisplay = document.getElementById('detail-admin-note-display');
    if (noteDisplay) noteDisplay.textContent = req.admin_note;
  }
  if (req.status === 'rejected' && req.admin_note) {
    var rejectReason = document.getElementById('detail-reject-reason');
    if (rejectReason) rejectReason.textContent = req.admin_note;
  }

  // Fill detail fields
  var fieldMap = [
    ['d-name', req.applicant_name], ['d-name-en', req.applicant_name_en || '-'],
    ['d-dept', req.department], ['d-dept-en', req.department_en || '-'],
    ['d-position', req.position_kr], ['d-position-en', req.position_en || '-'],
    ['d-phone', req.phone || '-'], ['d-mobile', req.mobile || '-'],
    ['d-email', req.email], ['d-ext', req.extension || '-'],
    ['d-paper', CONFIG.PAPER_TYPE_NAMES[req.paper_type] || req.paper_type],
    ['d-qty', (req.quantity || '-') + '장'],
    ['d-created', new Date(req.created_at).toLocaleString('ko-KR')],
    ['d-deadline', req.deadline_date || '-'],
  ];
  fieldMap.forEach(function(p) {
    var el = document.getElementById(p[0]);
    if (el) el.textContent = p[1];
  });

  // Card previews
  renderCardFront(document.getElementById('detail-front-canvas'), {
    name: req.applicant_name, department: req.department, positionKr: req.position_kr,
    phone: req.phone, mobile: req.mobile, email: req.email,
    extension: req.extension, address: req.address,
  });

  var backContainer = document.getElementById('detail-back-preview');
  if (req.is_bilingual) {
    if (backContainer) backContainer.classList.remove('hidden');
    renderCardBack(document.getElementById('detail-back-canvas'), {
      nameEn: req.applicant_name_en, positionEn: req.position_en,
      departmentEn: req.department_en, addressEn: req.address_en,
      phone: req.phone, mobile: req.mobile, email: req.email,
    });
  } else {
    if (backContainer) backContainer.classList.add('hidden');
  }

  // Timeline
  renderDetailTimeline(req.status_history);
}

function closeDetailModal() {
  var overlay = document.getElementById('detail-modal-overlay');
  if (overlay) overlay.classList.add('hidden');
}

function renderDetailTimeline(historyRaw) {
  var container = document.getElementById('detail-timeline');
  if (!container) return;
  var history = [];
  try {
    if (typeof historyRaw === 'string') history = JSON.parse(historyRaw);
    else if (Array.isArray(historyRaw)) history = historyRaw;
  } catch(e) { history = []; }

  if (history.length === 0) {
    container.innerHTML = '<p class="text-muted text-sm">이력 없음</p>';
    return;
  }
  container.innerHTML = '<div class="timeline">' +
    history.slice().reverse().map(function(item) {
      var date = item.timestamp ? new Date(item.timestamp).toLocaleString('ko-KR') : '-';
      var statusName = CONFIG.STATUS_NAMES[item.status] || item.status;
      return '<div class="timeline-item"><div class="timeline-dot"></div>' +
        '<div class="timeline-time">' + date + '</div>' +
        '<div class="timeline-status">' + statusName + '</div>' +
        (item.note ? '<div class="timeline-note">' + esc(item.note) + '</div>' : '') +
        '</div>';
    }).join('') +
    '</div>';
}

function openEditModal(req) {
  if (!req || req.status !== 'revision') return;
  editingRequest = req;
  var overlay = document.getElementById('edit-modal-overlay');
  if (!overlay) return;
  overlay.classList.remove('hidden');

  var adminNoteEl = document.getElementById('edit-admin-note');
  if (adminNoteEl) adminNoteEl.textContent = req.admin_note || '';

  // Prefill
  var fields = [
    ['edit-name', req.applicant_name], ['edit-name-en', req.applicant_name_en || ''],
    ['edit-department', req.department], ['edit-department-en', req.department_en || ''],
    ['edit-position-kr', req.position_kr], ['edit-position-en', req.position_en || ''],
    ['edit-phone', req.phone || ''], ['edit-mobile', req.mobile || ''],
    ['edit-email', req.email], ['edit-extension', req.extension || ''],
  ];
  fields.forEach(function(p) {
    var el = document.getElementById(p[0]);
    if (el) el.value = p[1];
  });
}

function closeEditModal() {
  var overlay = document.getElementById('edit-modal-overlay');
  if (overlay) overlay.classList.add('hidden');
}

async function submitEdit() {
  if (!editingRequest) return;
  var name  = document.getElementById('edit-name').value.trim();
  var email = document.getElementById('edit-email').value.trim();
  var dept  = document.getElementById('edit-department').value.trim();
  var posKr = document.getElementById('edit-position-kr').value.trim();

  if (!name || !email || !dept || !posKr) {
    alert('필수 항목(이름, 이메일, 부서, 직급)을 모두 입력해주세요.');
    return;
  }

  var historyEntry = {
    status: 'pending',
    timestamp: new Date().toISOString(),
    note: '신청자 수정 후 재접수',
  };
  var currentHistory = [];
  try {
    if (typeof editingRequest.status_history === 'string') currentHistory = JSON.parse(editingRequest.status_history);
    else if (Array.isArray(editingRequest.status_history)) currentHistory = editingRequest.status_history;
  } catch(e) { currentHistory = []; }
  currentHistory.push(historyEntry);

  var btn = document.getElementById('btn-submit-edit');
  if (btn) btn.disabled = true;

  try {
    var { error } = await window.supabase
      .from('card_requests')
      .update({
        applicant_name:    name,
        applicant_name_en: document.getElementById('edit-name-en').value.trim() || null,
        department:        dept,
        department_en:     document.getElementById('edit-department-en').value.trim() || null,
        position_kr:       posKr,
        position_en:       document.getElementById('edit-position-en').value.trim() || null,
        phone:             document.getElementById('edit-phone').value.trim() || null,
        mobile:            document.getElementById('edit-mobile').value.trim() || null,
        email:             email,
        extension:         document.getElementById('edit-extension').value.trim() || null,
        status:            'pending',
        status_history:    JSON.stringify(currentHistory),
        admin_note:        null,
      })
      .eq('id', editingRequest.id);

    if (error) throw error;
    alert('수정이 완료되었습니다. 관리자가 다시 검토할 예정입니다.');
    closeEditModal();
    lookupRequests();
  } catch(e) {
    console.error('[MyRequests] 수정 제출 실패:', e);
    alert('수정 제출 중 오류가 발생했습니다.');
  } finally {
    if (btn) btn.disabled = false;
  }
}

function esc(text) {
  if (!text) return '';
  return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>

</body>
</html>
